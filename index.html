<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>X Versions</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f1419; background: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      header { height: 64px; border-bottom: 1px solid #eff3f4; }
      .bar, main, footer { width: min(100% - 40px, 880px); margin: 0 auto; }
      .bar { height: 100%; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .mark { width: 30px; height: 30px; display: grid; place-items: center; background: #000; color: #fff; font-size: 19px; }
      a { color: inherit; text-decoration: none; }
      .link { padding: 9px 14px; border: 1px solid #cfd9de; border-radius: 999px; font-size: 14px; font-weight: 700; }
      main { padding: 100px 0 112px; }
      .eyebrow { margin: 0 0 14px; color: #1d9bf0; font-size: 13px; font-weight: 800; }
      h1 { max-width: 700px; margin: 0; font-size: 48px; line-height: 1.08; }
      .intro { max-width: 620px; margin: 22px 0 0; color: #536471; font-size: 18px; line-height: 1.65; }
      .details { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 34px; color: #536471; font-size: 14px; }
      .details strong { color: #0f1419; }
      footer { padding: 20px 0 28px; border-top: 1px solid #eff3f4; color: #536471; font-size: 13px; }
      @media (max-width: 600px) {
        .bar, main, footer { width: min(100% - 28px, 880px); }
        main { padding: 72px 0 84px; }
        h1 { font-size: 38px; }
        .intro { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="./"><span class="mark">X</span> X Versions</a>
        <a class="link" href="https://play.google.com/store/apps/details?id=com.twitter.android" target="_blank" rel="noreferrer">Google Play ↗</a>
      </div>
    </header>
    <main>
      <p class="eyebrow">ANDROID APP ARCHIVE</p>
      <h1>X Android 历史版本归档</h1>
      <p class="intro">X Versions 是一个记录 X（原 Twitter）Android 应用版本的开源项目。我们追踪 Google Play 上的版本信息，并整理历史版本及其来源、校验信息，方便查阅与研究。</p>
      <div class="details">
        <span>应用包名：<strong>com.twitter.android</strong></span>
        <a href="https://github.com/Rodert/x-versions" target="_blank" rel="noreferrer"><strong>查看 GitHub 项目 ↗</strong></a>
      </div>
    </main>
    <footer>本项目与 X Corp. 无关联。X 名称、商标及应用版权归其各自所有者所有。</footer>
  </body>
</html>
